[package]
name = "astrid-capsule-router"
version = "0.1.0"
description = "Tool execution routing middleware for Astrid OS"
authors = ["Joshua J. Bouw <dev@joshuajbouw.com>", "Unicity Labs <info@unicity-labs.com>"]
astrid-version = ">=0.1.0"

[[component]]
id = "router"
file = "astrid_capsule_router.wasm"
type = "executable"

[exports]
"astrid:tool" = "1.0.0"

[publish]
"tool.v1.execute.*" = { wit = "TODO" }
"tool.v1.execute.result" = { wit = "TODO" }

[subscribe]
"tool.v1.request.execute" = { wit = "TODO", handler = "handle_execute_request" }
"tool.v1.execute.*.result" = { wit = "TODO", handler = "handle_execute_result" }
